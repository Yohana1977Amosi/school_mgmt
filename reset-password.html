<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a new password | Smart School Management System</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-container">
        <section class="login-box" aria-labelledby="resetTitle">
            <h1>SMART SCHOOL</h1>
            <h2 id="resetTitle">Choose a new password</h2>
            <p>Use a password with at least 12 characters.</p>

            <form id="resetPasswordForm">
                <label for="newPassword">New password</label>
                <input
                    id="newPassword"
                    name="newPassword"
                    type="password"
                    autocomplete="new-password"
                    minlength="12"
                    required>

                <label for="confirmPassword">Confirm new password</label>
                <input
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    minlength="12"
                    required>

                <button type="submit" class="primary-button">Change password</button>
            </form>

            <p id="resetPasswordMessage" class="form-message" role="status" aria-live="polite"></p>
            <a class="text-button" href="/login.html">Return to login</a>
        </section>
    </main>
    <script src="js/reset-password.js" defer></script>
</body>
</html>
